[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bargeham"
version = "0.1.0"
description = "Intelligent Document Processing Platform with Knowledge Graph"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "BARGEHAM Team" },
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.4.0",
    "passlib[argon2]>=1.7.4",
    "python-multipart>=0.0.12",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "minio>=7.2.0",
    "boto3>=1.35.0",
    "structlog>=24.0.0",
    "prometheus-client>=0.21.0",
    "openai>=1.50.0",
    "httpx>=0.28.0",
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.6.0",
    "tesserocr>=2.7.0",
    "pdfplumber>=0.11.0",
    "camelot-py[cv]>=1.0.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "python-bidi>=0.4.2",
    "fpdf2>=2.7.0",
    "arabic-reshaper>=3.0.0",
    "weasyprint>=60.0",
    "pydantic-ai>=0.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "playwright>=1.45.0",
    "httpx>=0.28.0",
]

[project.scripts]
bargeham = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.hatch.build.targets.wheel.sources]
"backend/app" = "app"
"backend/migrations" = "migrations"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
addopts = "-v --cov=backend/app --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "N", "SIM", "TID"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]