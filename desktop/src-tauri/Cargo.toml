[package]
name = "app"
version = "0.1.0"
description = "BARGEHAM - Intelligent Document Processing Platform"
authors = ["BARGEHAM Team"]
license = "Apache-2.0"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = ["codegen"] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
